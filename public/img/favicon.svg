<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Gradiente amarillo vulcan -->
    <linearGradient id="vulcanFavInv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>

  <!-- Fondo oscuro/negro para que resalte en la pestaña -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#121212" stroke="url(#vulcanFavInv)" stroke-width="1.8" />

  <!-- Silueta de la bicicleta (Colores invertidos) -->
  <g transform="translate(0, 1)">
    <!-- Ruedas en Amarillo -->
    <circle cx="8" cy="22" r="4" fill="none" stroke="url(#vulcanFavInv)" stroke-width="1.6" />
    <circle cx="24" cy="22" r="4" fill="none" stroke="url(#vulcanFavInv)" stroke-width="1.6" />
    
    <!-- Eje de pedales -->
    <circle cx="16" cy="22" r="1.5" fill="#FFFFFF" />

    <!-- Cuadro de la bicicleta en Blanco -->
    <path d="M 8,22 L 14,12 L 20,22 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <path d="M 14,12 L 12,9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 20,22 L 22,10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 14,12 L 17,22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
